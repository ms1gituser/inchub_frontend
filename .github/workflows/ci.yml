name: IncHub CRM Frontend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-cd:
    name: Lint, Security Scan, Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Security Scan pre-flight
      run: node scripts/security-scan.mjs

    - name: TypeScript Validation
      run: npx tsc --noEmit

    - name: Run Linting
      run: npm run lint

    - name: Create Production Build
      run: npm run build

