name: IncHub CRM Frontend EC2 Deploy CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  audit-and-build:
    name: Security Scan, Build and Publish Container
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout codebase
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Node Environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    # 3. Install Dependencies
    - name: Install dependencies
      run: npm install --legacy-peer-deps

    # 4. Run Pre-flight Security Audit (Blocks pipeline on failure)
    - name: Run Pre-flight Security Scan
      run: node scripts/security-scan.mjs

    # 5. Run Type-Check Validation
    - name: Run TypeScript Validation
      run: npx tsc --noEmit

    # 6. Run Linting
    - name: Run Linting
      run: npm run lint

    # 7. Configure AWS Credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'me-central-1' }}

    # 8. Log in to Amazon ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 9. Set up Docker Buildx for optimized image caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 10. Build, tag, and push image to Amazon ECR
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/crm-frontend:latest
          ${{ steps.login-ecr.outputs.registry }}/crm-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: audit-and-build

    steps:
    # 1. Checkout repository (needed to access docker-compose.prod.yml for SCP)
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Configure AWS Credentials (to get ECR registry info)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'me-central-1' }}

    # 2. Log in to Amazon ECR to get the registry URL
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Free up disk space on EC2 (remove old Docker images/containers)
    - name: Cleanup disk space on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          docker system prune -af --volumes || true
          echo "=== Disk usage after cleanup ==="
          df -h /

    # 4. Copy docker-compose.prod.yml to EC2 via SSH (cat heredoc — no SCP needed)
    - name: Copy docker-compose.prod.yml via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p /home/${{ secrets.EC2_USER || 'ubuntu' }}/Inchub2021/CRM_Frontend
          cat > /home/${{ secrets.EC2_USER || 'ubuntu' }}/Inchub2021/CRM_Frontend/docker-compose.prod.yml << 'COMPOSE_EOF'
          version: '3.8'

          services:
            frontend:
              image: ${ECR_REGISTRY}/crm-frontend:latest
              container_name: crm-frontend-prod
              restart: always
              ports:
                - "3000:3000"
              env_file:
                - .env
          COMPOSE_EOF

    # 5. Get ECR login password on the runner (has AWS CLI) to pass to EC2
    - name: Get ECR Login Token
      id: ecr-token
      run: echo "password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'me-central-1' }})" >> $GITHUB_OUTPUT

    # 6. SSH into EC2, login to ECR, pull and restart containers
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_PASSWORD: ${{ steps.ecr-token.outputs.password }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY,ECR_PASSWORD
        script: |
          # Login to ECR using token passed from GitHub Actions runner
          echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          # Navigate to frontend application directory
          cd /home/${{ secrets.EC2_USER || 'ubuntu' }}/Inchub2021/CRM_Frontend

          # Pull latest image and restart
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

