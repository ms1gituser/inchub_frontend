name: IncHub CRM Frontend EC2 Deploy CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  audit-and-build:
    name: Security Scan, Build and Publish Container
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout codebase
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup Node Environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    # 3. Install Dependencies
    - name: Install dependencies
      run: npm ci

    # 4. Run Pre-flight Security Audit (Blocks pipeline on failure)
    - name: Run Pre-flight Security Scan
      run: node scripts/security-scan.mjs

    # 5. Run Type-Check Validation
    - name: Run TypeScript Validation
      run: npx tsc --noEmit

    # 6. Run Linting
    - name: Run Linting
      run: npm run lint

    # 7. Configure AWS Credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'me-central-1' }}

    # 8. Log in to Amazon ECR
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 9. Set up Docker Buildx for optimized image caching
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 10. Build, tag, and push image to Amazon ECR
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/crm-frontend:latest
          ${{ steps.login-ecr.outputs.registry }}/crm-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: audit-and-build

    steps:
    # 1. Configure AWS Credentials (to get ECR registry info)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'me-central-1' }}

    # 2. Log in to Amazon ECR to get the registry URL
    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Copy docker-compose.prod.yml to EC2 host via SCP
    - name: Copy docker-compose.prod.yml via SCP
      uses: appleboy/scp-action@v0.1.9
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "./docker-compose.prod.yml"
        target: "/home/${{ secrets.EC2_USER || 'ubuntu' }}/Inchub2021/CRM_Frontend"
        strip_components: 0

    # 4. SSH into EC2, Pull from ECR, and deploy via Docker Compose
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Log in to ECR on the EC2 host
          aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'me-central-1' }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

          # Navigate to frontend application directory
          mkdir -p /home/${{ secrets.EC2_USER || 'ubuntu' }}/Inchub2021/CRM_Frontend
          cd /home/${{ secrets.EC2_USER || 'ubuntu' }}/Inchub2021/CRM_Frontend

          # Export ECR Registry for Docker Compose to read
          export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

          # Pull latest image
          docker compose -f docker-compose.prod.yml pull

          # Re-create and start containers in detached mode
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
